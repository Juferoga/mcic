site_name: MCIC · Juferoga
site_description: Maestría en Ciencias de la Información y las Comunicaciones — Universidad Distrital Francisco José de Caldas
site_author: Juan Felipe Rodríguez Galindo
site_url: https://juferoga.github.io/mcic/
repo_url: https://github.com/Juferoga/mcic
repo_name: Juferoga/mcic
copyright: Juan Felipe Rodríguez Galindo · Universidad Distrital Francisco José de Caldas

theme:
  name: material
  custom_dir: overrides
  font:
    text: Inter
    code: JetBrains Mono
  language: es
  logo: assets/mcic-wordmark.svg
  favicon: assets/favicon.svg
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Modo claro
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.tooltips

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: "#"
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mcic-shaders.js
  - javascripts/mcic.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Juferoga
      name: GitHub
